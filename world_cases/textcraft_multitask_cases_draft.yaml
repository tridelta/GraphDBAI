      - {id: DS_001, d: easy, c: direct_success, setup: 24 diamonds and table, plan: craft all four armor pieces, solvable: true}
      - {id: DS_002, d: easy, c: missing_table, setup: 24 diamonds and 4 wood, plan: craft table then armor, solvable: true}
      - {id: DS_003, d: easy, c: blocked_material, setup: 12 diamonds and no resource access, plan: report impossible, solvable: false}
      - {id: DS_004, d: medium, c: mining_route, setup: iron pickaxe and known deep mine, plan: mine 3 times then craft armor, solvable: true}
      - {id: DS_005, d: medium, c: mining_blocked, setup: stone pickaxe and known mine, plan: report missing pickaxe, solvable: false}
      - {id: DS_006, d: medium, c: hidden_mine, setup: mine unknown with search available, plan: explore mine then mine and craft, solvable: true}
      - {id: DS_007, d: medium, c: trading_route, setup: known armorer and 40 emeralds, plan: move to village then trade set, solvable: true}
      - {id: DS_008, d: medium, c: inspect_then_trade, setup: armorer unknown and 40 emeralds, plan: inspect village then trade set, solvable: true}
