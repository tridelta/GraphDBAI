version: 0.2-draft
world: mytextcraft_mc
status: draft_not_active
family: golden_apple
goal: Obtain a golden apple.
visible_manual_refs:
  - golden_apple_crafting
  - apple_gathering
  - gold_mining
  - furnace_smelting
  - loot_chests
required_engine_actions:
  - craft
  - gather
  - mine
  - smelt
  - move_to
  - explore
  - inspect
  - loot
  - trade
  - report_impossible
minecraft_alignment:
  - Vanilla golden apple crafting uses one apple and eight gold ingots.
  - Dungeon/chest loot is represented as deterministic MyTextCraft hidden information.
cases:
  - id: GA_001
    title: Craft golden apple from existing ingredients.
    difficulty: easy
    characteristic: direct_success
    initial_state:
      inventory: {apple: 1, gold_ingot: 8, gold_ore: 0, furnace: false, fuel: 0, emerald: 0, pickaxe: none, golden_apple: false}
      environment: {nearby_mine: false, nearby_orchard: false, nearby_dungeon: false, nearby_village: false, mine_search_available: false, dungeon_search_available: false, biome: plains}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["craft(golden_apple)"], min_steps: 1, expected_strategy: direct_crafting}
    expected_experience: {path_type: crafting, learn: [golden_apple_requires_apple_and_8_gold_ingots]}

  - id: GA_002
    title: Gather apple, then craft golden apple.
    difficulty: easy
    characteristic: missing_apple
    initial_state:
      inventory: {apple: 0, gold_ingot: 8, gold_ore: 0, furnace: false, fuel: 0, emerald: 0, pickaxe: none, golden_apple: false}
      environment: {nearby_orchard: true, nearby_mine: false, nearby_dungeon: false, nearby_village: false, biome: forest}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["move_to(orchard)", "gather(apple)", "craft(golden_apple)"], min_steps: 3, expected_strategy: gather_then_craft}
    expected_experience: {path_type: gather_crafting, learn: [apple_can_be_gathered_from_orchard_or_forest]}

  - id: GA_003
    title: Smelt gold ore before crafting.
    difficulty: easy
    characteristic: smelt_gold
    initial_state:
      inventory: {apple: 1, gold_ingot: 0, gold_ore: 8, furnace: true, fuel: 8, emerald: 0, pickaxe: none, golden_apple: false}
      environment: {nearby_mine: false, nearby_orchard: false, nearby_dungeon: false, nearby_village: false, biome: plains}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["smelt(gold_ore)", "craft(golden_apple)"], min_steps: 2, expected_strategy: smelt_then_craft}
    expected_experience: {path_type: smelting, learn: [gold_ore_needs_furnace_and_fuel]}

  - id: GA_004
    title: Mine gold, smelt it, then craft.
    difficulty: medium
    characteristic: mine_gold
    initial_state:
      inventory: {apple: 1, gold_ingot: 0, gold_ore: 0, furnace: true, fuel: 8, emerald: 0, pickaxe: iron, golden_apple: false}
      environment: {nearby_mine: true, mine_has_gold: true, nearby_orchard: false, nearby_dungeon: false, nearby_village: false, biome: plains}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["move_to(mine)", "mine(gold_ore)", "smelt(gold_ore)", "craft(golden_apple)"], min_steps: 4, expected_strategy: mining}
    expected_experience: {path_type: mining_crafting, learn: [gold_route_requires_mine_pickaxe_furnace_fuel]}

  - id: GA_005
    title: Discover a hidden gold mine.
    difficulty: medium
    characteristic: hidden_gold_mine
    initial_state:
      inventory: {apple: 1, gold_ingot: 0, gold_ore: 0, furnace: true, fuel: 8, emerald: 0, pickaxe: iron, golden_apple: false}
      environment: {nearby_mine: unknown, mine_search_available: true, nearby_orchard: false, nearby_dungeon: false, nearby_village: false, biome: plains}
      hidden_facts: {nearby_mine: true, mine_has_gold: true}
      ambiguous: {nearby_mine: unknown}
      location: base
    oracle: {solvable: true, reference_plan: ["explore(mine)", "move_to(mine)", "mine(gold_ore)", "smelt(gold_ore)", "craft(golden_apple)"], min_steps: 5, expected_strategy: explore_then_mine}
    expected_experience: {path_type: mining_with_discovery, learn: [hidden_gold_mine_can_enable_crafting_route]}

  - id: GA_006
    title: Loot golden apple from dungeon chest.
    difficulty: medium
    characteristic: loot_route
    initial_state:
      inventory: {apple: 0, gold_ingot: 0, gold_ore: 0, furnace: false, fuel: 0, emerald: 0, pickaxe: none, golden_apple: false}
      environment: {nearby_dungeon: true, chest_has_golden_apple: unknown, nearby_mine: false, nearby_orchard: false, nearby_village: false, biome: plains}
      hidden_facts: {chest_has_golden_apple: true}
      ambiguous: {chest_has_golden_apple: unknown}
      location: base
    oracle: {solvable: true, reference_plan: ["move_to(dungeon)", "inspect(chest)", "loot(chest, golden_apple)"], min_steps: 3, expected_strategy: loot}
    expected_experience: {path_type: loot, learn: [inspect_unknown_chest_before_looting]}

  - id: GA_007
    title: Trade for apple, then craft.
    difficulty: medium
    characteristic: trade_apple
    initial_state:
      inventory: {apple: 0, gold_ingot: 8, gold_ore: 0, furnace: false, fuel: 0, emerald: 2, pickaxe: none, golden_apple: false}
      environment: {nearby_village: true, village_has_farmer: true, nearby_mine: false, nearby_orchard: false, nearby_dungeon: false, biome: plains}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["move_to(village)", "trade(farmer, emerald, apple)", "craft(golden_apple)"], min_steps: 3, expected_strategy: trade_then_craft}
    expected_experience: {path_type: trading_crafting, learn: [farmer_can_supply_missing_apple_in_textcraft]}

  - id: GA_008
    title: Gold mine is visible but tool is too weak.
    difficulty: medium
    characteristic: wrong_tool_blocked
    initial_state:
      inventory: {apple: 1, gold_ingot: 0, gold_ore: 0, furnace: true, fuel: 8, emerald: 0, pickaxe: stone, golden_apple: false}
      environment: {nearby_mine: true, mine_has_gold: true, nearby_orchard: false, nearby_dungeon: false, nearby_village: false, biome: plains}
      ambiguous: {}
      location: base
    oracle: {solvable: false, reference_plan: ["report_impossible(missing_required_pickaxe)"], expected_failure: missing_required_pickaxe, expected_strategy: report_after_tool_check}
    expected_experience: {path_type: blocked_mining, learn: [gold_mining_requires_iron_or_better_pickaxe]}

  - id: GA_009
    title: Chest is empty, switch to mining route.
    difficulty: hard
    characteristic: deceptive_loot
    initial_state:
      inventory: {apple: 0, gold_ingot: 0, gold_ore: 0, furnace: true, fuel: 8, emerald: 0, pickaxe: iron, golden_apple: false}
      environment: {nearby_dungeon: true, chest_has_golden_apple: unknown, nearby_mine: true, mine_has_gold: true, nearby_orchard: true, biome: forest}
      hidden_facts: {chest_has_golden_apple: false}
      ambiguous: {chest_has_golden_apple: unknown}
      location: base
    oracle: {solvable: true, reference_plan: ["move_to(dungeon)", "inspect(chest)", "move_to(orchard)", "gather(apple)", "move_to(mine)", "mine(gold_ore)", "smelt(gold_ore)", "craft(golden_apple)"], min_steps: 8, expected_strategy: switch_after_negative_inspection}
    expected_experience: {path_type: path_switching, learn: [failed_loot_route_should_not_end_episode_if_mining_route_exists]}

  - id: GA_010
    title: Gather apple and mine gold in one episode.
    difficulty: hard
    characteristic: multi_resource
    initial_state:
      inventory: {apple: 0, gold_ingot: 0, gold_ore: 0, furnace: true, fuel: 8, emerald: 0, pickaxe: iron, golden_apple: false}
      environment: {nearby_orchard: true, nearby_mine: true, mine_has_gold: true, nearby_dungeon: false, nearby_village: false, biome: forest}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["move_to(orchard)", "gather(apple)", "move_to(mine)", "mine(gold_ore)", "smelt(gold_ore)", "craft(golden_apple)"], min_steps: 6, expected_strategy: multi_resource_collection}
    expected_experience: {path_type: mixed_gather_mine, learn: [goal_requires_parallel_resource_collection]}

  - id: GA_011
    title: Mine is limited, trade for missing gold.
    difficulty: hard
    characteristic: limited_mine_then_trade
    initial_state:
      inventory: {apple: 1, gold_ingot: 0, gold_ore: 0, furnace: true, fuel: 8, emerald: 4, pickaxe: iron, golden_apple: false}
      environment: {nearby_mine: true, mine_has_gold: true, mine_gold_capacity: 4, nearby_village: true, village_has_farmer: true, nearby_orchard: false, biome: plains}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["move_to(mine)", "mine(gold_ore)", "smelt(gold_ore)", "move_to(village)", "trade(farmer, emerald, gold_ingot)", "craft(golden_apple)"], min_steps: 6, expected_strategy: mixed_mine_then_trade}
    expected_experience: {path_type: mixed, learn: [limited_resource_source_can_be_completed_by_trade]}

  - id: GA_012
    title: No apple or gold source exists.
    difficulty: impossible
    characteristic: no_viable_route
    initial_state:
      inventory: {apple: 0, gold_ingot: 0, gold_ore: 0, furnace: false, fuel: 0, emerald: 0, pickaxe: iron, golden_apple: false}
      environment: {nearby_orchard: false, nearby_mine: false, nearby_dungeon: false, nearby_village: false, mine_search_available: false, dungeon_search_available: false, biome: desert}
      ambiguous: {}
      location: base
    oracle: {solvable: false, reference_plan: ["report_impossible(no_viable_plan)"], expected_failure: missing_apple_and_gold_sources, expected_strategy: report_impossible}
    expected_experience: {path_type: impossible, learn: [golden_apple_needs_apple_and_gold_or_loot_route]}

