    oracle: {solvable: true, reference_plan: ["move_to(orchard)", "gather(apple)", "explore(mine)", "move_to(mine)", "mine(gold_ore)", "mine(gold_ore)", "smelt(gold_ore)", "craft(golden_apple)", "craft(golden_helmet)"], min_steps: 9, expected_strategy: gather_explore_mine_craft}
