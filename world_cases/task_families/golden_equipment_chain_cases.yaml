family: golden_equipment_chain
goal: Craft a golden apple and a golden helmet in the same episode.
visible_manual_refs: [golden_apple_crafting, apple_gathering, gold_mining, furnace_smelting, loot_chests, golden_equipment_crafting]
required_engine_actions: [craft, gather, mine, smelt, move_to, explore, inspect, loot, trade, report_impossible]
minecraft_alignment:
  - MyTextCraft uses a symbolic golden helmet recipe with five gold ingots.
  - The task intentionally composes the golden apple subgoal with a later equipment subgoal.
cases:
  - id: GEC_001
    title: Craft both items from existing ingredients.
    difficulty: easy
    characteristic: direct_success
    initial_state:
      inventory: {apple: 1, gold_ingot: 13, gold_ore: 0, furnace: false, emerald: 0, pickaxe: none, golden_apple: false, golden_helmet: false}
      environment: {nearby_orchard: false, nearby_mine: false, nearby_dungeon: false, nearby_village: false, biome: plains}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["craft(golden_apple)", "craft(golden_helmet)"], min_steps: 2, expected_strategy: direct_crafting}
    expected_experience: {path_type: compositional_crafting, learn: [golden_equipment_chain_requires_apple_and_13_gold_ingots]}

  - id: GEC_002
    title: Gather apple, then craft the chain.
    difficulty: easy
    characteristic: missing_apple
    initial_state:
      inventory: {apple: 0, gold_ingot: 13, gold_ore: 0, furnace: false, emerald: 0, pickaxe: none, golden_apple: false, golden_helmet: false}
      environment: {nearby_orchard: true, nearby_mine: false, nearby_dungeon: false, nearby_village: false, biome: forest}
      ambiguous: {}
      location: base
    oracle: {solvable: true, reference_plan: ["move_to(orchard)", "gather(apple)", "craft(golden_apple)", "craft(golden_helmet)"], min_steps: 4, expected_strategy: gather_then_craft}
    expected_experience: {path_type: gather_crafting, learn: [apple_subgoal_reused_before_equipment_crafting]}

  - id: GEC_003
    title: Mine and smelt enough gold before crafting both items.
    difficulty: medium
    characteristic: mine_gold_chain
    initial_state:
