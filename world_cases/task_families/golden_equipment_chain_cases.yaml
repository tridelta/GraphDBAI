      location: base
    oracle: {solvable: true, reference_plan: ["move_to(mine)", "mine(gold_ore)", "mine(gold_ore)", "smelt(gold_ore)", "craft(golden_apple)", "craft(golden_helmet)"], min_steps: 6, expected_strategy: mining_then_crafting}
