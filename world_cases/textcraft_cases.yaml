version: 0.1
world: textcraft_mc
cases:
  - id: TC_CRAFT_001
    title: Craft full diamond set from existing materials.
    difficulty: easy
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 24
        emerald: 0
        wood: 0
        crafting_table: true
        pickaxe: none
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: false
        nearby_mine: false
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: true
      reference_plan:
        - craft(diamond_helmet)
        - craft(diamond_chestplate)
        - craft(diamond_leggings)
        - craft(diamond_boots)
      min_steps: 4
      expected_strategy: crafting
    expected_experience:
      path_type: crafting
      graph_nodes:
        - has_enough_diamonds
        - has_crafting_table
        - diamond_set_obtained
      graph_edges:
        - action: craft(diamond_armor_pieces)
          result: success
      learned_preconditions: []
    notes: Baseline success case for direct crafting.

  - id: TC_CRAFT_002
    title: Crafting is blocked without crafting table, but table can be crafted from wood.
    difficulty: easy
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 24
        emerald: 0
        wood: 4
        crafting_table: false
        pickaxe: none
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: false
        nearby_mine: false
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: true
      reference_plan:
        - craft(crafting_table)
        - craft(diamond_helmet)
        - craft(diamond_chestplate)
        - craft(diamond_leggings)
        - craft(diamond_boots)
      min_steps: 5
      expected_strategy: crafting
    expected_experience:
      path_type: crafting
      graph_nodes:
        - has_enough_diamonds
        - needs_crafting_table
        - has_crafting_table
        - diamond_set_obtained
      graph_edges:
        - action: craft(crafting_table)
          result: success
        - action: craft(diamond_armor_pieces)
          result: success
      learned_preconditions:
        - action: craft(diamond_armor_pieces)
          requires:
            inventory.crafting_table: true
    notes: Teaches that enough diamonds alone are not sufficient.

  - id: TC_CRAFT_003
    title: Direct crafting blocked by insufficient diamonds.
    difficulty: easy
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 12
        emerald: 0
        wood: 4
        crafting_table: true
        pickaxe: none
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: false
        nearby_mine: false
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: false
      reference_plan: []
      min_steps: null
      expected_strategy: impossible
      failure_reason: insufficient_diamonds_and_no_resource_access
    expected_experience:
      path_type: blocked_crafting
      graph_nodes:
        - needs_more_diamonds
      graph_edges:
        - action: craft(diamond_set)
          result: blocked
          failure_reason: insufficient_diamonds
      learned_preconditions:
        - action: craft(diamond_set)
          requires:
            inventory.diamond: ">=24"
    notes: Negative crafting case for precondition learning.

  - id: TC_MINE_001
    title: Mining path succeeds with nearby mine and iron pickaxe.
    difficulty: medium
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 0
        wood: 4
        crafting_table: true
        pickaxe: iron
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: false
        nearby_mine: true
        mine_depth: deep
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: true
      reference_plan:
        - move_to(mine)
        - mine(diamond)
        - mine(diamond)
        - mine(diamond)
        - craft(diamond_helmet)
        - craft(diamond_chestplate)
        - craft(diamond_leggings)
        - craft(diamond_boots)
      min_steps: 8
      expected_strategy: mining
    expected_experience:
      path_type: mining
      graph_nodes:
        - has_iron_pickaxe
        - mine_available
        - has_enough_diamonds
        - diamond_set_obtained
      graph_edges:
        - action: mine(diamond)
          result: success
      learned_preconditions:
        - action: mine(diamond)
          requires:
            environment.nearby_mine: true
            tool.pickaxe_level: ">=3"
    notes: Main positive mining case.

  - id: TC_MINE_002
    title: Mining is blocked without iron-level pickaxe.
    difficulty: medium
