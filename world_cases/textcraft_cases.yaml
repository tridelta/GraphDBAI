        - action: trade(armorer, emerald, diamond_set)
          result: blocked
          failure_reason: no_armorer
      learned_preconditions:
        - action: trade(armorer, emerald, diamond_set)
          requires:
            environment.village_has_armorer: true
    notes: Negative hidden-information trading case.

  - id: TC_MIXED_001
    title: Trade one piece, then mine enough diamonds for the rest.
    difficulty: hard
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 10
        wood: 4
        crafting_table: true
        pickaxe: iron
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: true
        village_has_armorer: true
        nearby_mine: true
        mine_depth: shallow
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: true
      reference_plan:
        - move_to(village)
        - trade(armorer, emerald, diamond_boots)
        - move_to(mine)
        - mine(diamond)
        - mine(diamond)
        - mine(diamond)
        - craft(diamond_helmet)
        - craft(diamond_chestplate)
        - craft(diamond_leggings)
      min_steps: 9
      expected_strategy: mixed_trade_then_mine
    expected_experience:
      path_type: mixed
      graph_nodes:
        - partial_armor_from_trade
        - mine_available
        - has_iron_pickaxe
        - enough_diamonds_for_remaining_pieces
      graph_edges:
        - action: trade(armorer, emerald, diamond_boots)
          result: success
        - action: mine(diamond)
          result: success
        - action: craft(remaining_diamond_armor)
          result: success
      learned_preconditions:
        - action: craft(remaining_diamond_armor)
          requires:
            inventory.crafting_table: true
    notes: Tests whether graph can represent mixed strategy, not only pure mining or pure trading.

  - id: TC_MIXED_002
    title: Mining yield is insufficient, then trading fills the missing pieces.
    difficulty: hard
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 20
        wood: 4
        crafting_table: true
        pickaxe: iron
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: true
        village_has_armorer: true
        nearby_mine: true
        mine_depth: shallow
        mine_diamond_capacity: 16
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: true
      reference_plan:
        - move_to(mine)
        - mine(diamond)
        - mine(diamond)
        - move_to(village)
        - trade(armorer, emerald, diamond_chestplate)
        - trade(armorer, emerald, diamond_boots)
        - craft(diamond_helmet)
        - craft(diamond_leggings)
      min_steps: 8
      expected_strategy: mixed_mine_then_trade
    expected_experience:
      path_type: mixed
      graph_nodes:
        - mine_available
        - mine_capacity_limited
        - armorer_available
        - partial_crafting_possible
      graph_edges:
        - action: mine(diamond)
          result: partial_success
          revealed:
            environment.mine_diamond_capacity: 16
        - action: trade(armorer, emerald, diamond_armor_piece)
          result: success
      learned_preconditions:
        - action: pure_mining_path
          blocked_by:
            environment.mine_diamond_capacity: "<24"
    notes: Tests path switching after discovering resource limits.

  - id: TC_IMPOSSIBLE_001
    title: No mine, no village, and no exploration source.
    difficulty: impossible
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 0
        wood: 4
        crafting_table: true
        pickaxe: iron
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: false
        nearby_mine: false
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: false
      reference_plan: []
      min_steps: null
      expected_strategy: impossible
      failure_reason: no_resource_access
    expected_experience:
      path_type: impossible
      graph_nodes:
        - no_mine
        - no_village
        - no_exploration_source
      graph_edges: []
      learned_preconditions:
        - task: diamond_set
          requires_any:
            - inventory.diamond: ">=24"
            - environment.nearby_mine: true
            - environment.village_has_armorer: true
            - environment.mine_search_available: true
            - environment.village_search_available: true
    notes: Oracle sanity case. Agent should stop or report impossible within step budget.
