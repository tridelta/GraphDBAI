      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 0
        wood: 4
        crafting_table: true
        pickaxe: stone
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: false
        nearby_mine: true
        mine_depth: deep
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: false
      reference_plan: []
      min_steps: null
      expected_strategy: impossible
      failure_reason: missing_required_pickaxe
    expected_experience:
      path_type: blocked_mining
      graph_nodes:
        - mine_available
        - needs_iron_pickaxe
      graph_edges:
        - action: mine(diamond)
          result: blocked
          failure_reason: missing_required_pickaxe
      learned_preconditions:
        - action: mine(diamond)
          requires:
            tool.pickaxe_level: ">=3"
    notes: Core failure case for hard precondition extraction.

  - id: TC_MINE_003
    title: Mine is unknown and should be discovered before mining.
    difficulty: medium
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 0
        wood: 4
        crafting_table: true
        pickaxe: iron
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: false
        nearby_mine: unknown
        mine_search_available: true
        village_search_available: false
        biome: plains
      hidden_facts:
        nearby_mine: true
        mine_depth: deep
      ambiguous:
        nearby_mine: unknown
      location: base
    oracle:
      solvable: true
      reference_plan:
        - explore(mine)
        - move_to(mine)
        - mine(diamond)
        - mine(diamond)
        - mine(diamond)
        - craft(diamond_helmet)
        - craft(diamond_chestplate)
        - craft(diamond_leggings)
        - craft(diamond_boots)
      min_steps: 9
      expected_strategy: inspect_then_mine
    expected_experience:
      path_type: mining_with_discovery
      graph_nodes:
        - mine_status_unknown
        - mine_available
        - has_iron_pickaxe
        - has_enough_diamonds
      graph_edges:
        - action: explore(mine)
          result: reveals
          revealed:
            environment.nearby_mine: true
        - action: mine(diamond)
          result: success
      learned_preconditions:
        - action: mine(diamond)
          requires:
            environment.nearby_mine: true
    notes: Tests needs_info path behavior.

  - id: TC_TRADE_001
    title: Trading path succeeds when armorer is known and emeralds are enough.
    difficulty: medium
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 40
        wood: 0
        crafting_table: false
        pickaxe: none
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: true
        village_has_armorer: true
        nearby_mine: false
        mine_search_available: false
        village_search_available: false
        biome: plains
      ambiguous: {}
      location: base
    oracle:
      solvable: true
      reference_plan:
        - move_to(village)
        - trade(armorer, emerald, diamond_set)
      min_steps: 2
      expected_strategy: trading
    expected_experience:
      path_type: trading
      graph_nodes:
        - village_available
        - armorer_available
        - has_enough_emeralds
        - diamond_set_obtained
      graph_edges:
        - action: trade(armorer, emerald, diamond_set)
          result: success
      learned_preconditions:
        - action: trade(armorer, emerald, diamond_set)
          requires:
            environment.village_has_armorer: true
            inventory.emerald: ">=40"
    notes: Main positive trading case.

  - id: TC_TRADE_002
    title: Village exists but armorer is unknown, so inspect should come before trading.
    difficulty: medium
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 40
        wood: 0
        crafting_table: false
        pickaxe: none
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: true
        village_has_armorer: unknown
        nearby_mine: false
        mine_search_available: false
        village_search_available: false
        biome: plains
      hidden_facts:
        village_has_armorer: true
      ambiguous:
        village_has_armorer: unknown
      location: base
    oracle:
      solvable: true
      reference_plan:
        - move_to(village)
