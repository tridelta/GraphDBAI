          result: success
      learned_preconditions:
        - action: trade(armorer, emerald, diamond_set)
          requires:
            environment.village_has_armorer: true
    notes: Retriever should mark trading as needs_info before inspect.

  - id: TC_TRADE_003
    title: Village has no armorer, so trading path should be rejected.
    difficulty: medium
    task:
      id: diamond_set
    initial_state:
      inventory:
        diamond: 0
        emerald: 40
        wood: 0
        crafting_table: false
        pickaxe: none
        diamond_helmet: false
        diamond_chestplate: false
        diamond_leggings: false
        diamond_boots: false
      environment:
        nearby_village: true
        village_has_armorer: unknown
        nearby_mine: false
        mine_search_available: false
        village_search_available: false
        biome: plains
      hidden_facts:
        village_has_armorer: false
      ambiguous:
        village_has_armorer: unknown
      location: base
    oracle:
      solvable: false
      reference_plan:
        - move_to(village)
        - inspect(village)
      min_steps: null
      expected_strategy: impossible_after_inspect
