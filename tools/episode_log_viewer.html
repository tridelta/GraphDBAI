<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <base href="../">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ExperienceGraph Step 解读器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #171b26;
      --muted: #667085;
      --line: #d8dee8;
      --soft: #eef2f6;
      --accent: #0f766e;
      --accent-soft: #e6f4f1;
      --bad: #b42318;
      --bad-soft: #fee4e2;
      --good: #027a48;
      --good-soft: #dcfae6;
      --warn: #b54708;
      --warn-soft: #fef0c7;
      --info: #175cd3;
      --info-soft: #dbeafe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 { font-size: 18px; margin: 0; font-weight: 650; white-space: nowrap; }
    .file-pill {
      display: inline-flex;
      align-items: center;
      max-width: 34vw;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 650;
      background: var(--soft);
      color: #344054;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drop {
      margin-left: auto;
      border: 1px dashed #98a2b3;
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--muted);
      background: #fcfcfd;
      cursor: pointer;
      font-size: 13px;
    }
    .drop.active { border-color: var(--accent); color: var(--accent); background: #ecfdf3; }
    main {
      display: grid;
      grid-template-columns: minmax(320px, 390px) minmax(0, 1fr);
      height: calc(100vh - 64px);
    }
    aside { border-right: 1px solid var(--line); background: var(--panel); overflow: auto; }
    .summary {
      padding: 16px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .summary b { color: var(--ink); }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .episode-label {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
      color: #475467;
      font-size: 12px;
      font-weight: 700;
    }
    .step {
      width: 100%;
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 10px;
      padding: 12px 14px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
    }
    .step:hover, .step.selected { background: #eef6f5; }
    .badge {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 750;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .step.failed .badge { background: var(--bad-soft); color: var(--bad); }
    .step.done .badge { background: var(--good-soft); color: var(--good); }
    .step.stalled .badge { background: var(--warn-soft); color: var(--warn); }
    .step-title { font-size: 14px; font-weight: 650; margin-bottom: 5px; overflow-wrap: anywhere; }
    .step-meta { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .status-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    section { overflow: auto; padding: 22px; }
    .empty { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; line-height: 1.6; }
    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .topline h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 0; }
    .topline p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .interpretation {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .interpretation h3 { margin: 0 0 12px; font-size: 16px; }
    .readout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .read-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fcfcfd;
      min-height: 86px;
    }
    .read-card b {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--muted);
    }
    .read-card p { margin: 0; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
    .notes {
      margin: 0;
      padding-left: 20px;
      color: #344054;
      font-size: 14px;
      line-height: 1.6;
    }
    .notes li + li { margin-top: 4px; }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .metric b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .metric span { display: block; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
    details { background: var(--panel); margin: 12px 0; overflow: hidden; }
    summary { cursor: pointer; padding: 12px 14px; font-weight: 650; border-bottom: 1px solid var(--line); }
    details:not([open]) summary { border-bottom: 0; }
    pre {
      margin: 0;
      padding: 14px;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.45;
      background: #fbfcfe;
    }
    .structured-block {
      padding: 14px;
      background: #fbfcfe;
    }
    .message-list {
      display: grid;
      gap: 10px;
    }
    .message-card,
    .content-panel,
    .meta-panel {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .message-card summary,
    .content-panel summary,
    .meta-panel summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      font-weight: 650;
      border-bottom: 1px solid var(--line);
      list-style: none;
    }
    .message-card summary::-webkit-details-marker,
    .content-panel summary::-webkit-details-marker,
    .meta-panel summary::-webkit-details-marker {
      display: none;
    }
    .message-card:not([open]) summary,
    .content-panel:not([open]) summary,
    .meta-panel:not([open]) summary {
      border-bottom: 0;
    }
    .message-header {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .message-role {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 700;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .message-index,
    .json-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }
    .message-body {
      padding: 12px;
      display: grid;
      gap: 10px;
    }
    .message-label {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .json-tree {
      display: block;
      margin: 0;
      padding: 0;
      list-style: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      user-select: none;
      -webkit-user-select: none;
    }
    .json-branch,
    .json-node {
      margin: 0;
      list-style: none;
    }
    .json-node summary {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 2px 0 2px 22px;
      border: 0;
      background: transparent;
      list-style: none;
      cursor: pointer;
      font-weight: 500;
    }
    .json-node summary::-webkit-details-marker {
      display: none;
    }
    .json-node summary::before {
      content: "+";
      position: absolute;
      left: 0;
      top: 3px;
      width: 13px;
      height: 13px;
      display: grid;
      place-items: center;
      border: 1px solid #98a2b3;
      background: #fff;
      color: #344054;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
    }
    .json-node[open] > summary::before {
      content: "-";
    }
    .json-children {
      margin-left: 6px;
      padding-left: 16px;
      border-left: 1px solid #cbd5e1;
    }
    .json-leaf {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 0;
      padding: 2px 0 2px 22px;
      min-height: 18px;
      list-style: disc;
    }
    .json-leaf::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 6px;
      width: 9px;
      height: 9px;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 50%;
    }
    .json-key {
      color: #344054;
      font-size: 13px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }
    .json-value {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .json-type-string { color: #0f766e; }
    .json-type-number { color: #175cd3; }
    .json-type-boolean { color: #b54708; font-weight: 700; }
    .json-type-null,
    .json-type-undefined { color: #98a2b3; font-style: italic; }
    .json-type-struct { color: #7c3aed; }
    .json-string-block {
      margin: 4px 0 0;
      padding: 8px 10px;
      border-left: 2px solid #99f6e4;
      background: #f0fdfa;
      color: #0f766e;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 650;
      background: var(--soft);
      color: #344054;
    }
    .pill.ok { background: var(--good-soft); color: var(--good); }
    .pill.bad { background: var(--bad-soft); color: var(--bad); }
    .pill.warn { background: var(--warn-soft); color: var(--warn); }
    .pill.info { background: var(--info-soft); color: var(--info); }
    .analysis-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
    .analysis-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
    .analysis-card b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .analysis-card span { font-size: 20px; font-weight: 700; }
    .figure-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin: 14px 0; }
    .figure-grid img { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--panel); }
    th, td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
    th { background: #f8fafc; color: #475467; }
    @media (max-width: 900px) {
      header { align-items: flex-start; flex-wrap: wrap; }
      .file-pill { max-width: 100%; }
      .drop { margin-left: 0; width: 100%; text-align: center; }
      main { grid-template-columns: 1fr; height: auto; min-height: calc(100vh - 64px); }
      aside { height: 42vh; border-right: 0; border-bottom: 1px solid var(--line); }
      section { height: auto; min-height: 58vh; }
      .readout, .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 540px) {
      .readout, .metrics { grid-template-columns: 1fr; }
      .topline { display: block; }
    }
  </style>
</head>
<body>
  <header>
    <h1>ExperienceGraph Step 解读器</h1>
    <div id="fileName" class="file-pill">尚未载入文件</div>
    <label id="drop" class="drop">拖入 JSONL，或点击选择文件<input id="file" type="file" accept=".json,.jsonl" hidden /></label>
  </header>
  <main>
    <aside>
      <div id="summary" class="summary">
        载入 <code>steps.jsonl</code> 后，左侧按 episode 和 step 展示时间线；右侧会给出中文解读，并保留原始 LLM 输入、输出和完整 step 记录。
      </div>
      <div id="timeline"></div>
    </aside>
    <section id="detail">
      <div class="empty">还没有选中 step。<br>请拖入一个 <code>steps.jsonl</code> 文件。</div>
    </section>
  </main>
<script>
const fileInput = document.querySelector('#file');
const drop = document.querySelector('#drop');
const fileName = document.querySelector('#fileName');
const timeline = document.querySelector('#timeline');
const detail = document.querySelector('#detail');
const summary = document.querySelector('#summary');
let rows = [];
let selected = 0;
let analysisSummary = null;

const ACTION_ZH = {
  craft: '合成',
  gather: '采集',
  mine: '挖矿',
  move_to: '移动',
  inspect: '检查',
  explore: '探索',
  trade: '交易',
  report_impossible: '报告不可解'
};

const FAILURE_ZH = {
  invalid_llm_output: '模型输出不是可解析的动作 JSON',
  max_steps_exceeded: '用完 step 预算仍未完成',
  mine_not_discovered: '矿点尚未发现，不能直接进入或挖矿',
  no_nearby_mine: '当前环境没有可用矿点',
  no_village: '当前环境没有可到达村庄',
  no_armorer: '村庄没有 armorer，交易路线不可行',
  missing_precondition: '动作前置条件不满足',
  insufficient_resource: '资源不足',
  invalid_action: '动作不在环境可接受范围内',
  malformed_action: '动作格式不符合 schema',
  village_search_unavailable: '村庄搜索不可用',
  not_at_village: '当前位置不在村庄',
  premature_impossible_report: '过早报告不可解',
  incorrect_impossible_report: '错误报告不可解',
  step_budget_exhausted: '用完 step 预算仍未完成',
  no_action: '模型没有给出动作'
};

const TERMINAL_FAILURE_REASONS = new Set([
  'unknown_action',
  'premature_impossible_report',
  'incorrect_impossible_report',
  'no_action',
  'invalid_llm_output'
]);

fileInput.addEventListener('change', event => loadFile(event.target.files[0]));
for (const name of ['dragenter', 'dragover']) {
  drop.addEventListener(name, event => {
    event.preventDefault();
    drop.classList.add('active');
  });
}
for (const name of ['dragleave', 'drop']) {
  drop.addEventListener(name, event => {
    event.preventDefault();
    drop.classList.remove('active');
  });
}
drop.addEventListener('drop', event => loadFile(event.dataTransfer.files[0]));

async function loadFile(file) {
  if (!file) return;
  const text = await file.text();
  const parsed = parseRows(text);
  fileName.textContent = file.name;
  const maybeAnalysis = parsed.length === 1 ? parsed[0] : null;
  if (maybeAnalysis?.kind === 'stage2_analysis_summary') {
    analysisSummary = maybeAnalysis;
    rows = [];
    selected = 0;
    renderAnalysis(maybeAnalysis);
    return;
  }
  analysisSummary = null;
  rows = parsed
    .filter(row => row && (row.step_index !== undefined || row.llm_input_messages || row.action))
    .map((row, index) => ({ ...row, __order: index }));
  rows.sort(compareRows);
  selected = 0;
  render();
}

function parseRows(text) {
  const trimmed = text.trim();
  if (!trimmed) return [];
  try {
    const parsed = JSON.parse(trimmed);
    return Array.isArray(parsed) ? parsed : [parsed];
  } catch (_) {
    return trimmed.split(/\r?\n/).filter(Boolean).map(line => JSON.parse(line));
  }
}

function compareRows(a, b) {
  return Number(a.episode_index ?? 0) - Number(b.episode_index ?? 0)
    || String(a.episode_id ?? '').localeCompare(String(b.episode_id ?? ''))
    || Number(a.step_index ?? 0) - Number(b.step_index ?? 0)
    || Number(a.__order ?? 0) - Number(b.__order ?? 0);
}

function renderAnalysis(payload) {
  const runs = payload.main_comparison || [];
  const diagnostics = payload.run_diagnostics || [];
  const figures = payload.figures || [];
  const artifacts = payload.artifacts || {};
  const successValues = runs.map(row => Number(row.success_rate || 0));
  const avgSuccess = successValues.length ? successValues.reduce((a, b) => a + b, 0) / successValues.length : 0;
  const failures = diagnostics.reduce((sum, row) => sum + (row.failures || []).length, 0);
  const repeated = diagnostics.reduce((sum, row) => sum + Number(row.repeated_action_alerts || 0), 0);
  summary.innerHTML = `
    <b>${escapeHtml(payload.analysis_dir || 'analysis')}</b><br>
    ${runs.length} 个 run · 平均成功率 ${(avgSuccess * 100).toFixed(1)}%
    <div class="legend">
      ${statusPill('失败 episode', failures, failures ? 'bad' : 'ok')}
      ${statusPill('重复动作警告', repeated, repeated ? 'warn' : 'ok')}
      ${statusPill('分析 JSON', 1, 'info')}
    </div>
  `;
  timeline.innerHTML = diagnostics.map((row, index) => {
    const failed = (row.failures || []).length;
    const tone = failed ? 'failed' : '';
    return `
      <button class="step ${tone}" data-run-index="${index}">
        <div class="badge">${index + 1}</div>
        <div>
          <div class="step-title">${escapeHtml(row.agent || '')}/${escapeHtml(row.variant || '')}</div>
          <div class="step-meta">${escapeHtml(row.run_group || 'cold_start')} · ${row.successes || 0}/${row.episodes || 0} 成功 · ${failed} 失败</div>
          <div class="status-row">${pill(failed ? '有失败' : '无失败', failed ? 'bad' : 'ok')}${pill(`重复 ${row.repeated_action_alerts || 0}`, row.repeated_action_alerts ? 'warn' : 'info')}</div>
        </div>
      </button>
    `;
  }).join('');
  timeline.querySelectorAll('[data-run-index]').forEach(button => {
    button.addEventListener('click', () => renderAnalysisRun(payload, Number(button.dataset.runIndex)));
  });
  detail.innerHTML = `
    <div class="topline">
      <div>
        <h2>Stage 2 分析汇总</h2>
        <p>${escapeHtml(payload.analysis_dir || '')}</p>
      </div>
    </div>
    <div class="analysis-grid">
      ${analysisCard('Runs', runs.length)}
      ${analysisCard('平均成功率', `${(avgSuccess * 100).toFixed(1)}%`)}
      ${analysisCard('失败 episode', failures)}
    </div>
    <article class="interpretation">
      <h3>图表</h3>
      <div class="figure-grid">
        ${figures.map(fig => `<figure><img src="${escapeHtml(fig.path)}" alt="${escapeHtml(fig.name)}"><figcaption>${escapeHtml(fig.name)} · ${escapeHtml(fig.path)}</figcaption></figure>`).join('')}
      </div>
    </article>
    ${tableBlock('主结果', runs, ['agent', 'variant', 'run_group', 'episodes_completed', 'success_rate', 'avg_steps_success', 'tokens_per_episode'])}
    ${tableBlock('运行诊断', diagnostics, ['agent', 'variant', 'run_group', 'successes', 'episodes', 'repeated_action_alerts', 'llm_retries', 'hidden_fact_prompts'])}
    ${block('Artifacts', artifacts, true)}
    ${block('完整分析 JSON', payload, false)}
  `;
}

function renderAnalysisRun(payload, index) {
  const row = (payload.run_diagnostics || [])[index];
  if (!row) return;
  detail.innerHTML = `
    <div class="topline">
      <div>
        <h2>${escapeHtml(row.agent || '')}/${escapeHtml(row.variant || '')}</h2>
        <p>${escapeHtml(row.run_id || '')}</p>
      </div>
      <div class="status-row">${pill(`${row.successes || 0}/${row.episodes || 0} 成功`, (row.failures || []).length ? 'warn' : 'ok')}</div>
    </div>
    <div class="analysis-grid">
      ${analysisCard('Run group', row.run_group || 'cold_start')}
      ${analysisCard('重复动作警告', row.repeated_action_alerts || 0)}
      ${analysisCard('LLM retries', row.llm_retries || 0)}
    </div>
    ${tableBlock('失败 episode', row.failures || [], ['episode_id', 'case_id', 'failure_reason', 'steps'])}
    ${block('Step failures', row.step_failures || {}, true)}
    ${block('Run diagnostic JSON', row, false)}
  `;
}

function analysisCard(label, value) {
  return `<div class="analysis-card"><b>${escapeHtml(label)}</b><span>${escapeHtml(formatInline(value))}</span></div>`;
}

function tableBlock(title, data, keys) {
  const rows = Array.isArray(data) ? data : [];
  const body = rows.length
    ? rows.map(row => `<tr>${keys.map(key => `<td>${escapeHtml(formatInline(row[key]))}</td>`).join('')}</tr>`).join('')
    : `<tr><td colspan="${keys.length}">无记录</td></tr>`;
  return `<details open><summary>${escapeHtml(title)}</summary><table><thead><tr>${keys.map(key => `<th>${escapeHtml(key)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></details>`;
}
function render() {
  if (!rows.length) {
    summary.innerHTML = '没有识别到 step 记录。请确认文件是 <code>steps.jsonl</code> 或包含 step 对象的 JSON。';
    timeline.innerHTML = '';
    detail.innerHTML = '<div class="empty">没有可展示的数据。</div>';
    return;
  }
  const run = rows[0]?.run_id || '未知 run';
  const episodes = new Set(rows.map(row => row.episode_id || `episode_${row.episode_index ?? 0}`));
  const stats = countStatuses(rows);
  summary.innerHTML = `
    <b>${escapeHtml(run)}</b><br>
    ${episodes.size} 个 episode · ${rows.length} 个 step
    <div class="legend">
      ${statusPill('成功', stats.done, 'ok')}
      ${statusPill('有效推进', stats.progress, 'info')}
      ${statusPill('无明显推进', stats.stalled, 'warn')}
      ${statusPill('终止失败', stats.failed, 'bad')}
      ${statusPill('可恢复失败', stats.recoverable, 'warn')}
    </div>
  `;
  timeline.innerHTML = '';
  let lastEpisode = null;
  rows.forEach((row, index) => {
    const episodeKey = row.episode_id || `episode_${row.episode_index ?? 0}`;
    if (episodeKey !== lastEpisode) {
      lastEpisode = episodeKey;
      const label = document.createElement('div');
      label.className = 'episode-label';
      label.textContent = `${episodeKey} · ${row.case_id || '未知 case'} · ${row.case_title || ''}`.trim();
      timeline.appendChild(label);
    }
    const reading = interpretStep(row, rows, index);
    const button = document.createElement('button');
    button.className = `step ${index === selected ? 'selected' : ''} ${reading.cssClass}`;
    button.innerHTML = `
      <div class="badge">${escapeHtml(row.step_index ?? index)}</div>
      <div>
        <div class="step-title">${escapeHtml(reading.timelineTitle)}</div>
        <div class="step-meta">${escapeHtml(reading.timelineMeta)}</div>
        <div class="status-row">${pill(reading.statusText, reading.tone)}${pill(reading.progressText, reading.progressTone)}</div>
      </div>
    `;
    button.addEventListener('click', () => {
      selected = index;
      render();
    });
    timeline.appendChild(button);
  });
  renderDetail(rows[selected], selected);
}

function renderDetail(row, index) {
  if (!row) {
    detail.innerHTML = '<div class="empty">还没有选中 step。</div>';
    return;
  }
  const reading = interpretStep(row, rows, index);
  const usage = row.llm_usage_delta || {};
  detail.innerHTML = `
    <div class="topline">
      <div>
        <h2>${escapeHtml(reading.heading)}</h2>
        <p>${escapeHtml(row.run_id || '未知 run')} · ${escapeHtml(row.episode_id || '未知 episode')} · ${escapeHtml(row.case_id || '未知 case')}</p>
      </div>
      <div class="status-row">${pill(reading.statusText, reading.tone)}${pill(reading.progressText, reading.progressTone)}</div>
    </div>
    <article class="interpretation">
      <h3>中文解读</h3>
      <div class="readout">
        ${readCard('这个 step 是什么', reading.what)}
        ${readCard('动作是否合适', reading.judgement)}
        ${readCard('为什么会这样', reading.why)}
        ${readCard('后续怎么看', reading.next)}
      </div>
      <ul class="notes">
        ${reading.notes.map(note => `<li>${escapeHtml(note)}</li>`).join('')}
      </ul>
    </article>
    <div class="metrics">
      ${metric('Agent', row.agent)}
      ${metric('Variant', row.variant)}
      ${metric('动作', actionLabel(row.action) || '无动作')}
      ${metric('结果', resultLabel(row))}
      ${metric('候选路径数', row.candidate_paths ?? 0)}
      ${metric('View tokens', row.experience_view_tokens ?? 0)}
      ${metric('LLM tokens', usage.total_tokens || usage.estimated_prompt_tokens || 0)}
      ${metric('置信度', row.agent_confidence ?? outputValue(row, 'confidence') ?? '未知')}
    </div>
    ${llmMessagesBlock(row.llm_input_messages)}
    ${block('LLM 解析后输出', row.llm_output, true)}
    ${block('LLM 原始响应', row.llm_raw_response, false)}
    ${block('动作执行结果', pick(row, ['ok', 'done', 'episode_done', 'episode_success', 'episode_terminal_reason', 'reward', 'cost', 'failure_reason', 'state_delta', 'revealed_conditions']), true)}
    ${block('完整 step 原始记录', row, false)}
  `;
}

function interpretStep(row, allRows, index) {
  const parsedPrompt = parsePrompt(row);
  const previous = previousComparableStep(row, allRows, index);
  const action = actionLabel(row.action) || '没有动作';
  const actionName = row.action?.name || '';
  const status = classifyStatus(row);
  const progress = classifyProgress(row, previous, parsedPrompt);
  const failure = translateFailure(row.failure_reason);
  const repeated = previous && sameAction(previous.action, row.action);
  const revealed = Array.isArray(row.revealed_conditions) ? row.revealed_conditions : [];
  const stateDelta = row.state_delta && Object.keys(row.state_delta).length ? row.state_delta : null;
  const observedState = parsedPrompt?.observation?.state || {};
  const env = observedState.environment || {};
  const location = observedState.location;
  const notes = [];

  if (row.agent_rationale) notes.push(`模型给出的理由：${row.agent_rationale}`);
  if (row.llm_output?.selected_strategy) notes.push(`Graph agent 选择的策略：${formatInline(row.llm_output.selected_strategy)}`);
  if (row.llm_output?.selected_plan) notes.push(`模型计划：${formatInline(row.llm_output.selected_plan)}`);
  if (row.llm_output?.novel_candidate_path) notes.push(`本 step 生成的新候选路径：${formatInline(row.llm_output.novel_candidate_path)}`);
  if (row.candidate_paths !== undefined) notes.push(`Experience view 中有 ${row.candidate_paths} 条候选路径，估算 ${row.experience_view_tokens ?? 0} tokens。`);
  if (parsedPrompt?.step_budget_remaining !== undefined) notes.push(`进入该 step 时还剩 ${parsedPrompt.step_budget_remaining} 次动作预算。`);
  if (revealed.length) notes.push(`这一步揭示了新条件：${revealed.map(formatCondition).join('；')}。`);
  if (stateDelta) notes.push(`环境状态变化：${formatInline(stateDelta)}。`);
  if (row.ok === false && row.failure_reason) notes.push(`环境返回的失败原因：${failure}。`);
  if (row.oracle_solvable === false) notes.push('这个 case 标记为 oracle_solvable=false，理论上可能不存在完成任务的路线；此时更重要的是观察 agent 能否及时识别不可解。');
  if (repeated) notes.push('它和上一个 step 选择了同一个动作，需要关注是否在重复尝试。');

  const what = buildWhat(row, parsedPrompt, action);
  const judgement = buildJudgement(row, progress, repeated, env, location);
  const why = buildWhy(row, parsedPrompt, failure, repeated);
  const next = buildNext(row, progress, env, actionName);

  return {
    heading: `Step ${row.step_index ?? index}: ${action}`,
    timelineTitle: `${actionVerb(row.action)} ${actionTarget(row.action)}`.trim() || action,
    timelineMeta: `${row.case_id || '未知 case'} · ${progress.short}`,
    statusText: status.text,
    tone: status.tone,
    progressText: progress.text,
    progressTone: progress.tone,
    cssClass: status.cssClass || progress.cssClass,
    what,
    judgement,
    why,
    next,
    notes: notes.length ? notes : ['这条 step 记录较少，主要依据动作、结果和 LLM 输出做基础解读。']
  };
}

function isEpisodeTerminal(row) {
  if (row.episode_done === true) return true;
  if (row.done === true) return true;
  return row.ok === false && TERMINAL_FAILURE_REASONS.has(row.failure_reason || row.agent_rationale || '');
}

function isEpisodeFailure(row) {
  return isEpisodeTerminal(row) && row.episode_success !== true && row.done !== true;
}

function isImpossibleAction(row) {
  return row.action?.name === 'report_impossible';
}

function impossibleFailureText(reason) {
  if (reason === 'premature_impossible_report') return '过早 impossible';
  if (reason === 'incorrect_impossible_report') return '误报 impossible';
  return translateFailure(reason);
}
function buildWhat(row, parsedPrompt, action) {
  const step = row.step_index ?? '?';
  const task = row.task || row.task_id || '未知任务';
  const location = parsedPrompt?.observation?.state?.location;
  const remaining = parsedPrompt?.step_budget_remaining;
  const locationPart = location ? `当时位置是 ${location}，` : '';
  const budgetPart = remaining !== undefined ? `还剩 ${remaining} 次动作预算。` : '';
  return `这是 episode 内第 ${step} 个决策。Agent 观察当前状态后，请 LLM 选择一个环境动作；本次任务是 ${task}，模型选择了 ${action}。${locationPart}${budgetPart}`;
}

function buildJudgement(row, progress, repeated, env, location) {
  if (row.done && isImpossibleAction(row)) return '这是正确的不可解报告；环境接受该动作并结束 episode。';
  if (row.done) return '这是终止成功 step，任务已经完成。';
  if (isEpisodeFailure(row) && isImpossibleAction(row)) return `episode 在这里终止失败：${impossibleFailureText(row.failure_reason)}。这不是环境路线不可行，而是 agent 对当前 case 的判断不对。`;
  if (isEpisodeFailure(row)) return `episode 在这里终止失败。失败信息是：${translateFailure(row.episode_terminal_reason || row.failure_reason)}。`;
  if (row.ok === false) return `动作没有被环境接受，但 runner 允许后续 step 修正。失败信息是：${translateFailure(row.failure_reason)}。`;
  if (progress.kind === 'progress') return '动作被环境接受，并且带来了状态变化或新信息，可以算作有效推进。';
  if (progress.kind === 'stalled' && repeated) return '动作合法，但没有带来新状态；而且它重复了上一步，需要关注 agent 是否在重复尝试。';
  if (row.action?.name === 'inspect' && env.village_has_armorer === false) return '动作合法，但村庄是否有 armorer 已经是 false，再检查村庄通常没有新信息。';
  if (row.action?.name === 'trade' && (location !== 'village' || env.village_has_armorer === false)) return '交易动作看起来不合适：交易需要在 village 且 village_has_armorer=true。';
  return '动作被环境接受，但日志里没有明显状态变化；需要结合后续 step 判断它是否只是中间动作。';
}

function buildWhy(row, parsedPrompt, failure, repeated) {
  if (row.done && isImpossibleAction(row)) return '该 case 的 oracle 标记为不可解，report_impossible 是正确终止动作。';
  if (isEpisodeFailure(row) && isImpossibleAction(row)) return `agent 选择了 report_impossible，但 oracle/环境判定当前任务仍有可行路线，返回 ${failure}。`;
  if (row.ok === false) return `环境根据前置条件拒绝了这个动作。常见原因是位置、资源、工具、hidden fact 或 JSON schema 不满足要求；本条记录给出的原因是 ${failure}。`;
  if (row.done) return '环境把 done 标记为 true，说明这个动作让任务目标达成。';
  if (repeated) return 'LLM 的 prompt 中仍有相同动作可选，但它没有把上一轮揭示的信息转化为停止、换路线或承认不可解。';
  if (parsedPrompt?.retrieved_trajectories?.length) return '这个 baseline 看到了相似历史轨迹，当前动作可能受 trajectory memory 影响。';
  if (parsedPrompt?.candidate_paths?.length) return 'Graph agent 看到了候选路径，当前动作可能来自检索路径或新候选路径的比较结果。';
  return '从日志看，模型主要依据当前 observation 和 action rules 做决策；详细原因可以在下面的 LLM 输出中查看。';
}

function buildNext(row, progress, env, actionName) {
  if (row.done && isImpossibleAction(row)) return '后续可以检查 agent 是否在更少步数内完成不可解识别，以及这条经验是否进入 memory。';
  if (row.done) return '后续可以检查完整 episode 是否用较少步数完成，以及这个成功路径是否进入 graph 或 baseline memory。';
  if (isEpisodeFailure(row)) return '这个 step 已经结束 episode；后续重点看 prompt、retrieved memory 和当时 observation，判断为什么 agent 过早停止。';
  if (row.ok === false) return '后续重点看 agent 是否会修正路线；如果下一步仍重复同类失败，说明 prompt 或 memory 没有帮助它理解前置条件。';
  if (row.oracle_solvable === false && env.village_has_armorer === false) return '这个 case 已经显示交易路线不可行。理想表现是停止无效尝试，或明确没有可行路线；若继续 inspect 或 trade，就属于策略层面的失败信号。';
  if (progress.kind === 'stalled') return '后续可以看是否继续选择同一动作；连续无推进 step 会消耗预算，并降低 episode 成功率。';
  if (actionName === 'inspect' && row.revealed_conditions?.length) return '下一步应使用刚揭示的条件重新规划，而不是再次检查同一个目标。';
  return '后续可以看 agent 是否把这一步的新状态用于选择下一步动作。';
}

function classifyStatus(row) {
  if (row.done && isImpossibleAction(row)) return { text: '正确不可解', tone: 'ok', cssClass: 'done' };
  if (row.done) return { text: '任务成功', tone: 'ok', cssClass: 'done' };
  if (isEpisodeFailure(row)) return { text: '任务失败', tone: 'bad', cssClass: 'failed' };
  if (row.ok === false) return { text: '动作失败', tone: 'warn', cssClass: 'stalled' };
  if (row.ok === true) return { text: '动作合法', tone: 'info', cssClass: '' };
  return { text: '结果未知', tone: 'warn', cssClass: 'stalled' };
}

function classifyProgress(row, previous, parsedPrompt) {
  if (row.done && isImpossibleAction(row)) return { kind: 'done', text: '识别不可解', short: '正确 impossible', tone: 'ok', cssClass: 'done' };
  if (row.done) return { kind: 'done', text: '已完成', short: '任务完成', tone: 'ok', cssClass: 'done' };
  if (isEpisodeFailure(row) && isImpossibleAction(row)) return { kind: 'terminal_failed', text: impossibleFailureText(row.failure_reason), short: translateFailure(row.failure_reason), tone: 'bad', cssClass: 'failed' };
  if (isEpisodeFailure(row)) return { kind: 'terminal_failed', text: '终止失败', short: translateFailure(row.episode_terminal_reason || row.failure_reason), tone: 'bad', cssClass: 'failed' };
  if (row.ok === false) return { kind: 'recoverable_failed', text: '可恢复失败', short: translateFailure(row.failure_reason), tone: 'warn', cssClass: 'stalled' };
  const hasDelta = row.state_delta && Object.keys(row.state_delta).length > 0;
  const hasReveal = Array.isArray(row.revealed_conditions) && row.revealed_conditions.length > 0;
  if (hasDelta || hasReveal) return { kind: 'progress', text: '有效推进', short: hasReveal ? '揭示新条件' : '状态变化', tone: 'info', cssClass: '' };
  if (previous && sameAction(previous.action, row.action)) return { kind: 'stalled', text: '重复动作', short: '可能卡住', tone: 'warn', cssClass: 'stalled' };
  if (row.action?.name === 'inspect' && parsedPrompt?.observation?.state?.environment?.village_has_armorer === false) {
    return { kind: 'stalled', text: '无明显推进', short: '重复检查已知条件', tone: 'warn', cssClass: 'stalled' };
  }
  return { kind: 'neutral', text: '中间动作', short: '等待后续判断', tone: 'info', cssClass: '' };
}

function parsePrompt(row) {
  const userMessage = (row.llm_input_messages || []).find(message => message.role === 'user');
  if (!userMessage || typeof userMessage.content !== 'string') return null;
  try {
    return JSON.parse(userMessage.content);
  } catch (_) {
    return null;
  }
}

function previousComparableStep(row, allRows, index) {
  for (let i = index - 1; i >= 0; i -= 1) {
    const candidate = allRows[i];
    if ((candidate.episode_id || candidate.episode_index) === (row.episode_id || row.episode_index)) return candidate;
  }
  return null;
}

function sameAction(a, b) {
  return JSON.stringify(a || null) === JSON.stringify(b || null);
}

function countStatuses(items) {
  return items.reduce((acc, row, index) => {
    const progress = classifyProgress(row, previousComparableStep(row, items, index), parsePrompt(row));
    if (row.done) acc.done += 1;
    else if (isEpisodeFailure(row)) acc.failed += 1;
    else if (row.ok === false) acc.recoverable += 1;
    else if (progress.kind === 'progress') acc.progress += 1;
    else if (progress.kind === 'stalled') acc.stalled += 1;
    return acc;
  }, { done: 0, progress: 0, stalled: 0, failed: 0, recoverable: 0 });
}

function metric(label, value) {
  return `<div class="metric"><b>${escapeHtml(label)}</b><span>${escapeHtml(formatInline(value))}</span></div>`;
}

function readCard(title, value) {
  return `<div class="read-card"><b>${escapeHtml(title)}</b><p>${escapeHtml(value)}</p></div>`;
}

function block(title, value, open) {
  return `<details ${open ? 'open' : ''}><summary>${escapeHtml(title)}</summary><pre>${escapeHtml(format(value))}</pre></details>`;
}

function llmMessagesBlock(messages) {
  if (!Array.isArray(messages)) return block('LLM 输入消息', messages, true);
  return `
    <details open>
      <summary>LLM 输入消息</summary>
      <div class="structured-block">
        <div class="message-list">
          ${messages.length ? messages.map(renderMessageCard).join('') : '<div class="json-leaf"><span class="json-key">暂无消息</span></div>'}
        </div>
      </div>
    </details>
  `;
}

function renderMessageCard(message, index) {
  const safeMessage = message && typeof message === 'object' ? message : { value: message };
  const role = safeMessage.role || `message_${index + 1}`;
  const metaEntries = Object.fromEntries(Object.entries(safeMessage).filter(([key]) => key !== 'content' && key !== 'role'));
  return `
    <details class="message-card" ${index === 0 ? 'open' : ''}>
      <summary>
        <span class="message-header">
          <span class="message-role">${escapeHtml(role)}</span>
          <span class="message-index">message #${index + 1}</span>
        </span>
      </summary>
      <div class="message-body">
        <div>
          <div class="message-label">content</div>
          ${renderMessageContent(safeMessage.content)}
        </div>
        ${Object.keys(metaEntries).length ? `
          <details class="meta-panel">
            <summary>
              <span class="message-header">
                <span>message metadata</span>
              </span>
            </summary>
            <div class="message-body">
              ${renderJsonTree(metaEntries, 0)}
            </div>
          </details>
        ` : ''}
      </div>
    </details>
  `;
}

function renderMessageContent(content) {
  if (content === undefined) {
    return '<div class="json-leaf"><span class="json-key">content</span><span class="json-value json-type-undefined">undefined</span></div>';
  }
  const parsed = typeof content === 'string' ? tryParseJson(content) : null;
  if (parsed !== null) {
    return `
      <details class="content-panel" open>
        <summary>
          <span class="message-header">
            <span>structured content</span>
          </span>
          <span class="json-hint">${describeValue(parsed)}</span>
        </summary>
        <div class="message-body">
          ${renderJsonTree(parsed, 0)}
        </div>
      </details>
      <details class="content-panel">
        <summary>
          <span class="message-header">
            <span>raw content</span>
          </span>
        </summary>
        <pre>${escapeHtml(format(parsed))}</pre>
      </details>
    `;
  }
  if (content && typeof content === 'object') {
    return `
      <details class="content-panel" open>
        <summary>
          <span class="message-header">
            <span>structured content</span>
          </span>
          <span class="json-hint">${describeValue(content)}</span>
        </summary>
        <div class="message-body">
          ${renderJsonTree(content, 0)}
        </div>
      </details>
    `;
  }
  return `
    <details class="content-panel" open>
      <summary>
        <span class="message-header">
          <span>text content</span>
        </span>
      </summary>
      <pre>${escapeHtml(format(content))}</pre>
    </details>
  `;
}

function renderJsonTree(value, depth) {
  if (value === null || typeof value !== 'object') {
    return `<ul class="json-tree">${renderJsonLeaf(null, value)}</ul>`;
  }
  const entries = Array.isArray(value)
    ? value.map((item, index) => [String(index), item])
    : Object.entries(value);
  if (!entries.length) {
    return `<ul class="json-tree">${renderJsonLeaf(null, Array.isArray(value) ? [] : {})}</ul>`;
  }
  return `<ul class="json-tree">${entries.map(([key, child]) => renderJsonNode(key, child, depth)).join('')}</ul>`;
}

function renderJsonNode(key, value, depth) {
  if (value !== null && typeof value === 'object') {
    const open = depth < 1 ? 'open' : '';
    return `
      <li class="json-branch">
        <details class="json-node" ${open}>
          <summary>
            <span class="message-header">
              <span class="json-key">${escapeHtml(key)}</span>
            </span>
            <span class="json-hint">${describeValue(value)}</span>
          </summary>
          <div class="json-children">
            ${renderJsonTree(value, depth + 1)}
          </div>
        </details>
      </li>
    `;
  }
  return renderJsonLeaf(key, value);
}

function renderJsonLeaf(key, value) {
  const renderedValue = renderScalarValue(value);
  return `
    <li class="json-leaf">
      ${key === null ? '' : `<span class="json-key">${escapeHtml(key)}</span>`}
      ${renderedValue}
    </li>
  `;
}

function renderScalarValue(value) {
  if (typeof value === 'string' && value.includes('\n')) {
    return `<pre class="json-string-block">${escapeHtml(value)}</pre>`;
  }
  return `<span class="json-value ${scalarTypeClass(value)}">${escapeHtml(formatScalar(value))}</span>`;
}

function tryParseJson(value) {
  if (typeof value !== 'string') return null;
  const trimmed = value.trim();
  if (!trimmed || !/^[\[{]/.test(trimmed)) return null;
  try {
    return JSON.parse(trimmed);
  } catch (_) {
    return null;
  }
}

function describeValue(value) {
  if (Array.isArray(value)) return `Array(${value.length})`;
  if (value && typeof value === 'object') return `Object(${Object.keys(value).length})`;
  return typeof value;
}

function formatScalar(value) {
  if (value === null) return 'null';
  if (value === undefined) return 'undefined';
  if (typeof value === 'string') return `"${value}"`;
  if (Array.isArray(value)) return `Array(${value.length})`;
  if (value && typeof value === 'object') return `Object(${Object.keys(value).length})`;
  return String(value);
}

function scalarTypeClass(value) {
  if (value === null) return 'json-type-null';
  if (value === undefined) return 'json-type-undefined';
  if (typeof value === 'string') return 'json-type-string';
  if (typeof value === 'number') return 'json-type-number';
  if (typeof value === 'boolean') return 'json-type-boolean';
  return 'json-type-struct';
}

function pick(obj, keys) {
  return Object.fromEntries(keys.map(key => [key, obj[key]]));
}

function format(value) {
  return typeof value === 'string' ? value : JSON.stringify(value ?? null, null, 4);
}

function formatInline(value) {
  if (value === undefined || value === null || value === '') return '无';
  if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
  return JSON.stringify(value);
}

function resultLabel(row) {
  if (row.done && isImpossibleAction(row)) return '正确报告不可解';
  if (row.done) return '任务完成';
  if (isEpisodeFailure(row)) return `终止失败：${translateFailure(row.episode_terminal_reason || row.failure_reason)}`;
  if (row.ok === false) return `可恢复失败：${translateFailure(row.failure_reason)}`;
  if (row.ok) return '动作被接受';
  return '未知';
}

function translateFailure(reason) {
  if (!reason) return '无失败原因';
  return FAILURE_ZH[reason] || reason;
}

function actionLabel(action) {
  if (!action) return '';
  if (typeof action === 'string') return action;
  const args = action.args || {};
  const vals = Object.values(args);
  return vals.length ? `${action.name}(${vals.join(', ')})` : action.name;
}

function actionVerb(action) {
  if (!action || typeof action === 'string') return action || '无动作';
  return ACTION_ZH[action.name] || action.name || '动作';
}

function actionTarget(action) {
  if (!action || typeof action === 'string') return '';
  const args = action.args || {};
  return args.location || args.target || args.resource || args.item || args.want || '';
}

function outputValue(row, key) {
  return row.llm_output && row.llm_output[key];
}

function formatCondition(condition) {
  if (!condition || typeof condition !== 'object') return formatInline(condition);
  return `${condition.key || 'condition'} ${condition.operator || '='} ${formatInline(condition.value)}`;
}

function statusPill(label, count, tone) {
  return `<span class="pill ${tone}">${escapeHtml(label)} ${count}</span>`;
}

function pill(label, tone) {
  return `<span class="pill ${tone || ''}">${escapeHtml(label)}</span>`;
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}
</script>
